name: Test Builds on Linux

on: [push, pull_request, workflow_dispatch]

jobs:
  build-set-linux:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        rust: ['1.85.1', 'stable']

    steps:
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v4

    - name: Setup problem matcher
      uses: r7kamura/rust-problem-matchers@v1

    - name: Install dependencies
      id: install-dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386 libxcb1-dev

    - name: Setup Rust
      id: setup-rust
      shell: bash
      run: |
        rustup toolchain install ${{ matrix.rust }} --profile minimal
        rustup target add --toolchain ${{ matrix.rust }} \
          x86_64-unknown-linux-gnu i686-unknown-linux-gnu

    - name: Build layer 64
      id: build-layer-64
      run: make layer-64 CARGO="cargo +${{ matrix.rust }}"

    - name: Build layer 32
      id: build-layer-32
      run: make layer-32 CARGO="cargo +${{ matrix.rust }}"

    - name: Run checks
      id: run-checks
      run: cd volt && cargo +${{ matrix.rust }} test --target x86_64-unknown-linux-gnu

  check-gui:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v4

    - name: Setup Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Compile sources
      id: compile-sources
      run: python -m compileall -q volt-gui

    - name: Import pure modules
      id: import-modules
      run: cd volt-gui && python -c "import probe, profiles, presets, database"

    - name: Check version sync
      id: check-version
      shell: bash
      run: |
        layer=$(sed -n 's/^version = "\(.*\)"/\1/p' volt/Cargo.toml | head -n1)
        gui=$(cd volt-gui && python -c "import database; print(database.APP_VERSION)")
        echo "layer=${layer} gui=${gui}"
        test "${layer}" = "${gui}"
